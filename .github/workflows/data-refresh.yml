name: Daily market data refresh

on:
  schedule:
    # 04:37 UTC = 06:37 local (UTC+2) — fresh data before the morning open routine
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Fetch snapshot and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch market snapshot
        run: python3 scripts/fetch_snapshot.py

      - name: Commit if changed
        run: |
          if git diff --quiet src/data/marketSnapshot.json; then
            echo "no changes"
          else
            git config user.name "tradepilot-bot"
            git config user.email "bot@users.noreply.github.com"
            git add src/data/marketSnapshot.json
            git commit -m "data: daily market snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
